<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI → Reaper spike</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #15161a;
        color: #e6e6e6;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        max-width: 60rem;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 0.25rem;
      }
      p.lede {
        margin: 0 0 1.25rem;
        color: #a0a4ad;
      }
      fieldset {
        border: 1px solid #333842;
        border-radius: 6px;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem 1rem;
      }
      legend {
        color: #a0a4ad;
        padding: 0 0.4rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        padding: 0.35rem 0.6rem;
        border-radius: 4px;
        border: 1px solid #444a55;
        background: #22252c;
        color: inherit;
      }
      button:hover:not(:disabled) {
        background: #2d313a;
      }
      button:disabled {
        opacity: 0.5;
      }
      button.danger {
        border-color: #7a3b3b;
      }
      #status {
        font-weight: 600;
      }
      #status.ok {
        color: #7fd18b;
      }
      #status.err {
        color: #ff8a80;
      }
      ul.ports {
        margin: 0.25rem 0 0;
        padding-left: 1.2rem;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      #log {
        height: 16rem;
        overflow: auto;
        background: #0e0f12;
        border: 1px solid #333842;
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>MIDI → Reaper spike</h1>
    <p class="lede">
      M0 check: a note sent from here lands on a Reaper track. See README “MIDI into Reaper” for routing.
    </p>

    <fieldset>
      <legend>Web MIDI</legend>
      <div class="row"><span id="status">Requesting MIDI access…</span></div>
    </fieldset>

    <fieldset>
      <legend>Send</legend>
      <div class="row">
        <label>Output <select id="output"></select></label>
        <label>Channel <select id="channel"></select></label>
      </div>
      <div class="row" style="margin-top: 0.75rem">
        <button id="note" disabled>Note C4</button>
        <button id="chord" disabled>Chord C–E–G–B</button>
        <button id="arp" disabled>Arpeggio (scheduled)</button>
        <button id="loopback" disabled title="Needs the output to feed back into an input, e.g. Midi Through">
          Loopback latency
        </button>
        <button id="panic" class="danger" disabled>Panic</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Ports</legend>
      <div class="row" style="gap: 2rem; align-items: flex-start">
        <div>Outputs<ul class="ports" id="outputs"></ul></div>
        <div>Inputs (logged below)<ul class="ports" id="inputs"></ul></div>
      </div>
    </fieldset>

    <div id="log"></div>

    <script type="module" src="./midi.ts"></script>
  </body>
</html>
